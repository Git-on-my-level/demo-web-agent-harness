<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Self-Modifying Web Agent Harness</title>
  <style>
    /* ═══════════════════════════════════════════════════════════
       RESET/BASE — shared variables, defaults, and element resets
       ═══════════════════════════════════════════════════════════ */
    :root {
      color-scheme: dark;
      --bg: #0b0f17;
      --bg-soft: #141b27;
      --panel: rgba(18, 24, 35, 0.94);
      --panel-2: rgba(11, 15, 23, 0.96);
      --line: rgba(162, 184, 214, 0.18);
      --line-strong: rgba(125, 211, 252, 0.3);
      --text: #e8eefb;
      --muted: #92a0bb;
      --accent: #55d0ff;
      --accent-2: #61f0c2;
      --danger: #ff7979;
      --warning: #ffcc66;
      --shadow: 0 18px 38px rgba(0, 0, 0, 0.34);
      --radius: 18px;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: "Inter", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(85, 208, 255, 0.12), transparent 30%),
        radial-gradient(circle at top right, rgba(97, 240, 194, 0.08), transparent 24%),
        linear-gradient(180deg, #09111a 0%, #05070b 100%);
      color: var(--text);
      font-family: var(--sans);
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #c8d5ef;
      letter-spacing: 0.02em;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(162, 184, 214, 0.18);
      border-radius: 12px;
      background: rgba(6, 9, 14, 0.72);
      color: var(--text);
      font-size: 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--line-strong);
      box-shadow: 0 0 0 3px rgba(85, 208, 255, 0.08);
    }

    input:hover:not(:focus),
    textarea:hover:not(:focus) {
      border-color: rgba(162, 184, 214, 0.28);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.5;
    }

    /* ═══════════════════════════════════════════════════════════
       LAYOUT — two-column shell with a sticky control plane
       ═══════════════════════════════════════════════════════════ */
    /* The page keeps controls visible while the mutable world occupies
       the remaining width. On smaller screens it collapses to one column. */
    body {
      display: grid;
      grid-template-columns: minmax(320px, 380px) minmax(0, 1fr);
      gap: 20px;
      padding: 20px;
    }

    @media (max-width: 1023px) {
      body {
        grid-template-columns: 1fr;
        padding: 0;
        padding-top: calc(50px + env(safe-area-inset-top, 0px));
        gap: 0;
      }

      #agent-control {
        position: static;
        height: auto;
        max-height: none;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      #agent-control.mobile-hidden,
      #agent-world.mobile-hidden {
        display: none;
      }

      #agent-world {
        min-height: calc(100vh - 48px);
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      #mobile-nav {
        display: flex;
      }
    }

    @media (min-width: 1024px) {
      #mobile-nav {
        display: none;
      }
    }

    /* ═══════════════════════════════════════════════════════════
       CONTROL PANEL — protected inputs, buttons, and header chrome
       ═══════════════════════════════════════════════════════════ */
    #agent-control {
      position: sticky;
      top: 20px;
      align-self: start;
      height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(29, 39, 57, 0.97), rgba(12, 17, 26, 0.98));
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
      min-height: 0;
    }

    .control-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 2px;
    }

    .control-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .control-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, #55d0ff 0%, #4f7cff 100%);
      display: grid;
      place-items: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .control-header h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.1;
      color: var(--text);
      -webkit-text-fill-color: currentColor;
    }

    .control-header-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .model-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid rgba(85, 208, 255, 0.15);
      border-radius: 8px;
      background: rgba(85, 208, 255, 0.06);
      font-size: 11px;
      color: var(--accent);
      font-family: var(--mono);
    }

    .model-badge::before {
      content: "\25C6";
      font-size: 8px;
    }

    .settings-bar {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.025);
    }

    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      box-shadow: none;
    }

    .settings-toggle:hover:not(:disabled),
    .settings-toggle:active:not(:disabled) {
      transform: none;
      filter: none;
    }

    .settings-summary {
      min-width: 0;
      color: #d8e4fb;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .settings-chevron {
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
    }

    .settings-body {
      display: grid;
      gap: 10px;
    }

    .field-grid {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .input-area {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    #prompt-input {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
      filter: brightness(0.96);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #submit-button {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #55d0ff 0%, #4f7cff 100%);
      color: #081019;
      box-shadow: 0 8px 20px rgba(79, 124, 255, 0.25);
    }

    #submit-button.running {
      background: linear-gradient(135deg, #3a9dbf 0%, #3a5fbf 100%);
    }

    #submit-button.running::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      animation: submitShimmer 1.8s ease-in-out infinite;
    }

    @keyframes submitShimmer {
      0% {
        left: -100%;
      }

      100% {
        left: 100%;
      }
    }

    #stop-button {
      background: linear-gradient(135deg, rgba(255, 121, 121, 0.95), rgba(219, 74, 74, 0.95));
      color: #fff;
      box-shadow: 0 8px 20px rgba(219, 74, 74, 0.2);
    }

    /* ═══════════════════════════════════════════════════════════
       OUTPUT LOG — execution transcript, tool payloads, and typing state
       ═══════════════════════════════════════════════════════════ */
    .log-panel {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }

    .log-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .log-panel h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .log-panel-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .log-panel span {
      color: var(--muted);
      font-size: 11px;
    }

    .clear-log-btn {
      padding: 4px 10px;
      border: 1px solid rgba(162, 184, 214, 0.15);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .clear-log-btn:hover {
      background: rgba(255, 121, 121, 0.1);
      color: #ffb0b0;
      border-color: rgba(255, 121, 121, 0.2);
    }

    #output-log {
      flex: 1;
      min-height: 120px;
      overflow-y: auto;
      padding-right: 4px;
      display: grid;
      gap: 6px;
    }

    .log-entry {
      display: grid;
      gap: 6px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.025);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .log-entry:nth-child(even) {
      background: rgba(255, 255, 255, 0.04);
    }

    .log-entry.user {
      border-color: rgba(85, 208, 255, 0.18);
      background: rgba(85, 208, 255, 0.06);
    }

    .log-entry.assistant {
      border-color: rgba(97, 240, 194, 0.15);
      background: rgba(97, 240, 194, 0.06);
    }

    .log-entry.tool {
      border-color: rgba(255, 204, 102, 0.28);
      background: linear-gradient(180deg, rgba(255, 204, 102, 0.12), rgba(255, 204, 102, 0.05));
      box-shadow: inset 0 0 0 1px rgba(255, 204, 102, 0.08);
    }

    .log-entry.error {
      border-color: rgba(255, 121, 121, 0.2);
      background: rgba(255, 121, 121, 0.07);
    }

    .log-entry.status {
      border-color: rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
    }

    .log-topline {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .log-kind {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .log-kind-icon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: inline-grid;
      place-items: center;
      font-size: 9px;
      flex-shrink: 0;
    }

    .log-entry.user .log-kind-icon {
      background: rgba(85, 208, 255, 0.2);
      color: #55d0ff;
    }

    .log-entry.assistant .log-kind-icon {
      background: rgba(97, 240, 194, 0.2);
      color: #61f0c2;
    }

    .log-entry.tool .log-kind-icon {
      background: rgba(255, 204, 102, 0.2);
      color: #ffcc66;
    }

    .log-entry.error .log-kind-icon {
      background: rgba(255, 121, 121, 0.2);
      color: #ff7979;
    }

    .log-entry.status .log-kind-icon {
      background: rgba(255, 255, 255, 0.1);
      color: var(--muted);
    }

    .log-time {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      font-family: var(--mono);
    }

    .log-content,
    .log-content pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      font-family: inherit;
      font-size: 13px;
    }

    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      border: 1px solid rgba(97, 240, 194, 0.15);
      border-radius: 12px;
      background: rgba(97, 240, 194, 0.06);
    }

    .typing-indicator .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-2);
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .typing-indicator .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-indicator .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typingBounce {
      0%,
      60%,
      100% {
        opacity: 0.3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    .tool-details {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.24);
      overflow: hidden;
    }

    .tool-details summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      list-style: none;
      padding: 10px 12px;
      font-size: 12px;
      color: #ffe2a2;
    }

    .tool-details summary::-webkit-details-marker {
      display: none;
    }

    .tool-details[open] summary {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
    }

    .tool-call-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tool-name-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid rgba(255, 204, 102, 0.3);
      border-radius: 999px;
      background: rgba(255, 204, 102, 0.16);
      color: #ffd88a;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--mono);
    }

    .tool-name-badge::before {
      content: "\2699";
      font-size: 11px;
    }

    .tool-call-note,
    .tool-arg-summary {
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
    }

    .tool-details pre {
      margin: 0;
      padding: 12px;
      color: #d9e2f5;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tool-args {
      white-space: pre-wrap;
    }

    /* ═══════════════════════════════════════════════════════════
       WORLD CONTAINER — immutable shell around the mutable demo pane
       ═══════════════════════════════════════════════════════════ */
    #agent-world {
      min-width: 0;
      min-height: calc(100vh - 40px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(243, 246, 255, 0.96));
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    /* ═══════════════════════════════════════════════════════════
       STATUS INDICATORS — runtime state chips and attention cues
       ═══════════════════════════════════════════════════════════ */
    .status-pill {
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(85, 208, 255, 0.12);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-pill.running {
      background: rgba(97, 240, 194, 0.14);
      color: var(--accent-2);
      animation: statusPulse 1.5s ease-in-out infinite;
    }

    .status-pill.error,
    .status-pill.interrupted {
      background: rgba(255, 121, 121, 0.14);
      color: #ffb0b0;
    }

    @keyframes statusPulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(97, 240, 194, 0.3);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(97, 240, 194, 0);
      }
    }

    /* ═══════════════════════════════════════════════════════════
       MOBILE NAV — segmented control pinned to top of viewport
       ═══════════════════════════════════════════════════════════ */
    #mobile-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 8px 12px;
      padding-top: calc(8px + env(safe-area-inset-top, 0px));
      background: linear-gradient(180deg, rgba(11, 15, 23, 0.97) 0%, rgba(11, 15, 23, 0.92) 100%);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .mobile-nav-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(162, 184, 214, 0.12);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .mobile-nav-tab {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .mobile-nav-tab.active {
      background: rgba(85, 208, 255, 0.12);
      color: var(--accent);
      box-shadow: 0 1px 4px rgba(85, 208, 255, 0.1);
    }

    @media (max-width: 720px) {
      .control-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .control-header-meta {
        justify-content: flex-start;
      }

      #agent-control {
        padding: 14px;
      }

      .input-area {
        padding: 10px;
      }

      #prompt-input {
        min-height: 80px;
      }
    }
  </style>
  <link rel="stylesheet" href="./styles/world-seed.css">
</head>
<body>
  <!-- ═══════════════════════════════════════════════════════════
       CONTROL PANEL — protected controls, inputs, and transcript
       ═══════════════════════════════════════════════════════════ -->
  <div id="agent-control">
    <!-- Header and model badge remain fixed while the world changes. -->
    <div class="control-header">
      <div class="control-title-row">
        <div class="control-icon">&#9881;</div>
        <h1>Agent Control</h1>
      </div>
      <div class="control-header-meta">
        <div class="status-pill idle" id="runtime-status">Idle</div>
        <div class="model-badge" id="model-badge">glm-5.1</div>
      </div>
    </div>

    <div class="settings-bar">
      <button class="settings-toggle" id="settings-toggle" type="button">
        <span class="settings-summary" id="settings-summary">&#9881; glm-5.1 &middot; api.z.ai</span>
        <span class="settings-chevron" id="settings-chevron">&#9662;</span>
      </button>
      <div class="settings-body" id="settings-body" style="display: none;">
        <div class="field-grid">
          <div class="field">
            <label for="api-key">API Key</label>
            <input id="api-key" type="password" placeholder="Enter API Key" autocomplete="off">
          </div>

          <div class="field">
            <label for="model-select">Model</label>
            <input id="model-select" type="text" value="glm-5.1" spellcheck="false" autocomplete="off">
          </div>

          <div class="field">
            <label for="api-endpoint">API Endpoint</label>
            <input id="api-endpoint" type="text" value="https://api.z.ai/api/coding/paas/v4" spellcheck="false" autocomplete="off">
          </div>
        </div>
      </div>
    </div>

    <!-- The log mirrors user messages, assistant replies, tool calls, and guardrails. -->
    <div class="log-panel">
      <div class="log-panel-header">
        <h2>Output Log</h2>
        <div class="log-panel-header-right">
          <span>Messages, tools, guardrails</span>
          <button class="clear-log-btn" id="clear-log-btn" type="button">Reset</button>
        </div>
      </div>
      <div id="output-log" aria-live="polite"></div>
    </div>

    <div class="input-area">
      <div class="field">
        <label for="prompt-input">Prompt</label>
        <div class="input-row">
          <textarea id="prompt-input" rows="2" placeholder="Example: Turn the page into a fake pizza fan profile with animated stickers."></textarea>
          <div class="input-buttons">
            <button id="submit-button" type="button">Run</button>
            <button id="stop-button" type="button">Stop</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       WORLD CONTAINER — the only region the agent is allowed to change
       ═══════════════════════════════════════════════════════════ -->
  <div id="agent-world"></div>

  <nav id="mobile-nav">
    <div class="mobile-nav-inner">
      <button class="mobile-nav-tab active" data-target="agent-control">
        <span>&#9881;</span> Control
      </button>
      <button class="mobile-nav-tab" data-target="agent-world">
        <span>&#9733;</span> Preview
